name: Deploy to TrueNAS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/dealme-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/dealme-web
  AUTOMATION_IMAGE: ghcr.io/${{ github.repository_owner }}/dealme-automation

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/DealMe.Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Automation image
        uses: docker/build-push-action@v6
        with:
          context: ./automation
          file: ./automation/Dockerfile
          push: true
          tags: |
            ${{ env.AUTOMATION_IMAGE }}:latest
            ${{ env.AUTOMATION_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Wait for Tailscale
        run: |
          for i in $(seq 1 30); do
            if tailscale ping --timeout=2s ${{ secrets.TRUENAS_HOST }} >/dev/null 2>&1; then
              echo "Tailscale connected to TrueNAS"
              break
            fi
            echo "Waiting for Tailscale connectivity... ($i/30)"
            sleep 2
          done
          tailscale status

      - name: Deploy to TrueNAS
        env:
          TRUENAS_SSH_KEY: ${{ secrets.TRUENAS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$TRUENAS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.TRUENAS_HOST }} >> ~/.ssh/known_hosts 2>&1 || true

          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            truenas_admin@${{ secrets.TRUENAS_HOST }} \
            "sudo docker pull ${{ env.WEB_IMAGE }}:latest && \
             sudo docker pull ${{ env.API_IMAGE }}:latest && \
             sudo docker pull ${{ env.AUTOMATION_IMAGE }}:latest && \
             sudo midclt call app.redeploy 'dealme'"

          echo "Deploy triggered. Images pulled and app redeployed."
