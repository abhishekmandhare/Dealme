# Local dev: build images from source instead of pulling from GHCR
services:
  dealme-api:
    build:
      context: ../src
      dockerfile: DealMe.Api/Dockerfile
    image: dealme-api:local

  dealme-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: dealme-web:local

  changedetection:
    ports: !reset
      - "5010:5000"

  automation:
    platform: linux/amd64
    ports:
      - "3100:3100"
      # 5900 is taken by macOS Screen Sharing; remap VNC to 5901 on host.
      - "5901:5900"
