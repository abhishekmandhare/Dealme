# Local dev: build images from source instead of pulling from GHCR
services:
  dealme-api:
    build:
      context: ../src
      dockerfile: DealMe.Api/Dockerfile
    image: dealme-api:local

  dealme-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: dealme-web:local

  changedetection:
    ports: !reset
      - "5010:5000"

  automation:
    platform: linux/amd64
    ports:
      - "3100:3100"
      - "5900:5900"
    depends_on: []  # android needs /dev/kvm — not available on Mac

  # Stub: override the android service so it doesn't require /dev/kvm on Mac.
  # Remove this block when deploying to TrueNAS.
  android:
    image: budtmo/docker-android:emulator_12.0
    devices: []
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
