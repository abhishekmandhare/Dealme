services:
  dealme-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/dealme-api:latest
    container_name: dealme-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      - CONNECTION_STRING=${CONNECTION_STRING:-Data Source=/data/dealme.db}
      - APPRISE_URL=http://apprise:8000
      - CDIO_URL=http://changedetection:5000
      - CDIO_API_KEY=${CDIO_API_KEY}
      - MIN_DEAL_VALUE=${MIN_DEAL_VALUE:-5.00}
      - TIMEZONE=${TIMEZONE:-Australia/Melbourne}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - AUTOMATION_URL=http://automation:3100
      # Competition auto-entry — leave COMPETITION_EMAIL empty to disable the feature.
      - COMPETITION_EMAIL=${COMPETITION_EMAIL:-}
      - COMPETITION_FIRST_NAME=${COMPETITION_FIRST_NAME:-}
      - COMPETITION_LAST_NAME=${COMPETITION_LAST_NAME:-}
      - COMPETITION_POSTCODE=${COMPETITION_POSTCODE:-}
      - COMPETITION_MAX_PER_RUN=${COMPETITION_MAX_PER_RUN:-5}
    volumes:
      - db-data:/data
    depends_on:
      - apprise
      - changedetection

  dealme-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/dealme-web:latest
    container_name: dealme-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - dealme-api

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - cdio-data:/datastore
    environment:
      - BASE_URL=${CDIO_BASE_URL:-http://changedetection:5000}

  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    restart: unless-stopped
    ports:
      - "8000:8000"

  automation:
    build:
      context: ../automation
      dockerfile: Dockerfile
    container_name: dealme-automation
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "3100:3100"
    volumes:
      - automation-data:/data
    environment:
      - SEARCH_COUNT=${SEARCH_COUNT:-33}
      - MIN_DELAY=${MIN_DELAY:-8000}
      - MAX_DELAY=${MAX_DELAY:-20000}
      - ANDROID_HOST=android
      - ANDROID_PORT=5555
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.1.179:30068}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
    depends_on:
      - android

  # Android emulator for Google Opinion Rewards automation.
  # Requires /dev/kvm — only runs on TrueNAS (Linux with KVM enabled).
  # First-time setup: open http://<host>:6080 (noVNC), install OpenGApps,
  # sign into your Google account, and install Google Opinion Rewards.
  android:
    image: budtmo/docker-android:emulator_12.0
    container_name: dealme-android
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kvm
    ports:
      - "6080:6080"
    environment:
      - EMULATOR_DEVICE=Samsung Galaxy S10
      - WEB_VNC=true
    volumes:
      - android-data:/root

volumes:
  db-data:
  cdio-data:
  automation-data:
  android-data:
