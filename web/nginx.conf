server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://dealme-api:5001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Automation runs (Run Now) take 5–10+ minutes to return; default 60s
        # nginx timeout surfaces as "Failed to load" in the UI before the server finishes.
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
    }
}
