<html lang="en">
  <head>
    <script>
      (function(){var t=localStorage.getItem('dealme-theme')||'dark';
      if(t==='system')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
      document.documentElement.setAttribute('data-theme',t)})();
    </script>

    <title>DealMe</title>
  </head>
